---
# tasks file for ansible-osx-command-line-tools

- name: Am I running on Mac OS X?
  fail:
    msg: Target host is not running Mac OS X
  when: ansible_facts.distribution != 'MacOSX'

- name: Remove existing Command Line Tools installation
  file:
    path: '{{ clt_path }}'
    state: absent
  when: force_install
  become: yes

- name: Check that the Command Line Tools path is present
  stat:
    path: '{{ clt_path }}'
  register: clt

- name: Is xcode-select path set?
  command: xcode-select -p
  register: xcode_select
  check_mode: no
  ignore_errors: true
  changed_when: false

- name: Check the Command Line Tools package metadata
  command: pkgutil --pkg-info=com.apple.pkg.Xcode
  register: pkg_info
  check_mode: no
  ignore_errors: true
  changed_when: false

- name: Prepare to install Command Line Tools
  file:
    path: /tmp/.com.apple.dt.CommandLineTools.installondemand.in-progress
    state: touch
  when: pkg_info.rc != 0 or xcode_select.rc != 0 or not clt.stat.exists

- name: Check for Command Line Tools in Software Update list
  shell: >
    set -o pipefail;
    softwareupdate -l |
    grep -B 1 -E 'Command Line Tools' |
    awk -F'*' '/^\*/ {print $2}' |
    sed 's/^ Label: //' |
    grep -iE '[0-9|.]' |
    sort |
    tail -n1
  args:
    executable: /bin/bash
  timeout: "{{ softwareupdate_timeout }}"
  register: su_list
  when:
    - pkg_info.rc != 0 or xcode_select.rc != 0 or not clt.stat.exists
  changed_when: false
  failed_when: su_list.stderr != 'No new software available.' and (su_list.rc != 0 or su_list.stdout|length == 0)

- name: Install Command Line Tools
  command: softwareupdate -i '{{ su_list.stdout }}'
  timeout: "{{ softwareupdate_timeout }}"
  when: pkg_info.rc != 0 or xcode_select.rc != 0 or not clt.stat.exists
  notify:
    - Cleanup
  register: su_result
  failed_when: >-
    su_result.rc != 0 or
    'Error installing updates.' in su_result.stdout
